<div id="app">
    <header class="topbar">
      <button class="icon-btn" id="backBtn" aria-label="Back" hidden="">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.4 4.6 8 12l7.4 7.4-1.4 1.4L5.2 12l8.8-8.8z"></path></svg>
      </button>
      <h1 id="viewTitle" tabindex="-1">Your Library</h1>
      <button class="icon-btn" id="menuBtn" aria-label="More">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="12" cy="19" r="2"></circle></svg>
      </button>
    </header>

    <main id="view">
    
    
    
    <div class="lib-actions">
      <button class="chip" id="newPl"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"></path></svg><span>New playlist</span></button>
    </div>
    <div class="list">
      <button class="row" data-go="#/all" aria-label="All sounds, playlist, 8 sounds">
        <div class="cover all-sounds"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 21 10.6 19.7C5.4 15 2 11.9 2 8.1 2 5 4.4 2.6 7.5 2.6c1.7 0 3.4.8 4.5 2.1a6 6 0 0 1 4.5-2.1C19.6 2.6 22 5 22 8.1c0 3.8-3.4 6.9-8.6 11.6z"></path></svg></div>
        <div class="meta"><div class="t">All sounds</div><div class="s">Playlist · 8 sounds</div></div>
      </button>
      
        <button class="row" data-go="#/playlist/mw0gxaf9lg882n" aria-label="Gym, playlist, 5 sounds">
          <div class="cover  grid"><img src="blob:http://127.0.0.1:8765/35705f82-8b85-4e67-862e-de187d92f814" alt="" data-cover="c7"><img src="blob:http://127.0.0.1:8765/e5b720f7-543a-47e1-b617-b65ba7ac49d8" alt="" data-cover="c5"><img src="blob:http://127.0.0.1:8765/47359048-60a0-467d-ab3e-cc9a96e407c5" alt="" data-cover="c4"><img src="blob:http://127.0.0.1:8765/c5d20f77-1ded-4525-b6ca-b3e988a6881d" alt="" data-cover="c8"></div>
          <div class="meta"><div class="t">Gym</div><div class="s">Playlist · 5 sounds</div></div>
        </button>
        <button class="row" data-go="#/playlist/mw0gxbfklu3h6w" aria-label="Chill, playlist, 4 sounds">
          <div class="cover  grid"><img src="blob:http://127.0.0.1:8765/c5d20f77-1ded-4525-b6ca-b3e988a6881d" alt="" data-cover="c8"><img src="blob:http://127.0.0.1:8765/c5500ecb-10a4-4f50-b9ab-6e3a59424e0d" alt="" data-cover="c2"><img src="blob:http://127.0.0.1:8765/cb2271e9-89b3-42cb-a1c3-10cac93d17d0" alt="" data-cover="c3"><img src="blob:http://127.0.0.1:8765/ce18fef7-e3c8-4af6-a11a-3b14b763ae56" alt="" data-cover="c6"></div>
          <div class="meta"><div class="t">Chill</div><div class="s">Playlist · 4 sounds</div></div>
        </button>
        <button class="row" data-go="#/playlist/mw0gxcfpo8bew4" aria-label="Road trip, playlist, 3 sounds">
          <img class="cover " src="blob:http://127.0.0.1:8765/35705f82-8b85-4e67-862e-de187d92f814" alt="" data-cover="c7">
          <div class="meta"><div class="t">Road trip</div><div class="s">Playlist · 3 sounds</div></div>
        </button>
    </div>
    
  </main>

    <div class="mini-player" id="miniPlayer" role="region" aria-label="Now playing" hidden="">
      <div class="mini-progress"><div id="miniProgressBar"></div></div>
      <button class="mini-open" id="miniOpen" aria-label="Open player">
        <img id="miniCover" alt="">
        <div class="mini-meta">
          <div class="mini-title" id="miniTitle"></div>
          <div class="mini-artist" id="miniArtist"></div>
        </div>
      </button>
      <button class="icon-btn" id="miniPlay" aria-label="Play"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg></button>
      <button class="icon-btn" id="miniNext" aria-label="Next">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6v12l8.5-6zM16 6h2v12h-2z"></path></svg>
      </button>
    </div>

    <div class="update-bar" id="updateBar" role="region" aria-label="Update" hidden="">
      <span>A new version of Tikify is ready.</span>
      <button class="btn primary" id="updateReload">Reload</button>
      <button class="icon-btn" id="updateLater" aria-label="Not now">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6l5.6-5.6L5 6.4z"></path></svg>
      </button>
    </div>

    <nav class="tabbar" aria-label="Main">
      <button data-tab="library" class="active" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3h2v18H4zm5 0h2v18H9zm5.5.6 1.9-.6 5.6 17.4-1.9.6z"></path></svg>
        <span>Library</span>
      </button>
      <button data-tab="add" class="add-tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"></path></svg>
        <span>Add sound</span>
      </button>
      <button data-tab="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3a7 7 0 0 1 5.6 11.2l5.1 5.1-1.4 1.4-5.1-5.1A7 7 0 1 1 10 3zm0 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"></path></svg>
        <span>Search</span>
      </button>
    </nav>
  </div>
<!--player-->
<section class="player" id="player" role="dialog" aria-modal="true" aria-labelledby="playerContext" hidden="">
    <div class="player-bg" id="playerBg"></div>
    <div class="player-inner">
      <div class="player-top">
        <button class="icon-btn" id="playerClose" aria-label="Close player">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.6 8.6 12 16l7.4-7.4 1.4 1.4-8.8 8.8L3.2 10z"></path></svg>
        </button>
        <div class="player-context" id="playerContext">Playing</div>
        <button class="icon-btn" id="playerMore" aria-label="More">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="12" cy="19" r="2"></circle></svg>
        </button>
      </div>
      <img class="player-cover" id="playerCover" alt="">
      <div class="player-meta">
        <div class="player-title" id="playerTitle"></div>
        <div class="player-artist" id="playerArtist"></div>
      </div>
      <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek" style="">
      <div class="times"><span id="curTime">0:00</span><span id="durTime">0:00</span></div>
      <div class="controls">
        <button class="icon-btn" id="shuffleBtn" aria-label="Shuffle" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3l4 4-4 4V8h-2.2l-3.1 4 3.1 4H17v-3l4 4-4 4v-3h-3.2l-3.4-4.4L7 18H3v-2h3l3.1-4L6 8H3V6h4l3.4 4.4L13.8 6H17z"></path></svg>
        </button>
        <button class="icon-btn big" id="prevBtn" aria-label="Previous">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6v12l-8.5-6zM6 6h2v12H6z"></path></svg>
        </button>
        <button class="play-btn" id="playBtn" aria-label="Play"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg></button>
        <button class="icon-btn big" id="nextBtn" aria-label="Next">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6v12l8.5-6zM16 6h2v12h-2z"></path></svg>
        </button>
        <button class="icon-btn" id="repeatBtn" aria-label="Repeat" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"></path></svg>
          <span class="repeat-one" id="repeatOne" hidden="">1</span>
        </button>
      </div>
      <a class="open-tiktok" id="openTiktok" target="_blank" rel="noopener">Open original TikTok</a>
    </div>
  </section>
<!--toast-->
<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true">Saved to Gym</div>
