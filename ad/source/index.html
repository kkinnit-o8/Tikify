<!doctype html>
<html><head><meta charset="utf-8">
<title>Tikify — TikTok ad (v2, dark)</title>
<!-- Fonts are local copies of Google Fonts (Unbounded, Bricolage Grotesque, Inter) so renders never depend on the network. -->
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  html,body{margin:0;background:#000;overflow:hidden}
  #film{position:relative;overflow:hidden;background:#08060D}
  #bg{position:absolute;left:0;top:0}
  #world{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0}
  .U{font-family:"Unbounded";font-weight:900;letter-spacing:-.035em;text-transform:uppercase}
  .Bh{font-family:"Bricolage Grotesque";font-weight:800;letter-spacing:-.035em}
  .Iw{font-family:"Inter";font-weight:800;letter-spacing:-.045em}
  .Is{font-family:"Inter";font-weight:700;letter-spacing:-.015em}
  *{-webkit-font-smoothing:antialiased}
</style></head>
<body>
<div id="film"><canvas id="bg" width="1" height="1"></canvas><div id="world"></div></div>
<script src="engine.js"></script>
<script>
  FILM.fonts = ['900 100px "Unbounded"', '800 100px "Bricolage Grotesque"', '500 100px "Inter"', '600 100px "Inter"', '700 100px "Inter"', '800 100px "Inter"'];
  // build() measures text, so make sure faces are loaded before scenes are defined-and-built (FILM.start awaits FILM.fonts too)
</script>
<script src="lib.js"></script>
<script src="scenes.js"></script>
<script>
  FILM.start({ W: 1080, H: 1920, fps: 30, dur: 551 / 30 });   // 18.367 s — the whole 18.34 s track
</script>
</body></html>
