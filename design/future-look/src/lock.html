<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><script src="shared.js"></script>
<style>
  .wall { position: absolute; inset: -100px; background: url(../covers/midnight.png) center 30%/cover; filter: blur(50px) saturate(1.6) brightness(.85); }
  .wallfade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(8,7,11,.1), rgba(8,7,11,.0) 40%, rgba(8,7,11,.55)); }
  .lock { position: absolute; top: 62px; left: 0; right: 0; text-align: center; color: rgba(255,255,255,.9); }
  .lock svg { width: 16px; height: 16px; margin: 0 auto; }
  .date { position: absolute; top: 96px; left: 0; right: 0; text-align: center; font-size: 20px; font-weight: 600; color: rgba(255,255,255,.88); letter-spacing: -.2px; }
  .time { position: absolute; top: 116px; left: 0; right: 0; text-align: center; font-size: 112px; font-weight: 700; letter-spacing: -5px; color: rgba(255,255,255,.92); line-height: 1; font-variant-numeric: tabular-nums; }
  .np { position: absolute; left: 12px; right: 12px; bottom: 132px; border-radius: 30px; padding: 16px 18px 18px; background: linear-gradient(180deg, rgba(70,30,80,.5), rgba(40,16,50,.55));
    border: 1px solid rgba(255,255,255,.14); box-shadow: 0 30px 70px rgba(0,0,0,.35); }
  .np .top { display: flex; align-items: center; gap: 12px; }
  .np img { width: 54px; height: 54px; border-radius: 12px; }
  .np .m { flex: 1; min-width: 0; }
  .np .t { font-weight: 700; font-size: 16px; letter-spacing: -.3px; }
  .np .s { font-size: 14px; color: rgba(255,255,255,.65); margin-top: 2px; }
  .np .app { display: flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; color: rgba(255,255,255,.7); letter-spacing: .2px; }
  .bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.22); margin-top: 18px; overflow: hidden; }
  .bar b { display: block; width: 38%; height: 100%; background: rgba(255,255,255,.92); border-radius: 3px; }
  .tm { display: flex; justify-content: space-between; font-size: 11.5px; color: rgba(255,255,255,.6); font-weight: 600; margin-top: 7px; font-variant-numeric: tabular-nums; }
  .ct { display: flex; justify-content: center; align-items: center; gap: 54px; margin-top: 8px; }
  .ct svg { width: 36px; height: 36px; }
  .ct .pp svg { width: 44px; height: 44px; }
  .qa { position: absolute; bottom: 44px; width: 50px; height: 50px; border-radius: 50%; background: rgba(0,0,0,.28); display: grid; place-items: center; }
  .qa svg { width: 22px; height: 22px; }
</style></head>
<body>
<div class="screen" id="s"></div>
<script>
document.getElementById('s').innerHTML = `
  <div class="wall"></div><div class="wallfade"></div>
  ${statusBar()}
  <div class="lock">${ic('lock')}</div>
  <div class="date">Wednesday 4 November</div>
  <div class="time">9:41</div>
  <div class="np">
    <div class="top"><img class="cover" src="../covers/midnight.png">
      <div class="m"><div class="t">Midnight Drive (sped up)</div><div class="s">@noctra</div></div>
      <div class="app">${mark(18)}Tikify</div></div>
    <div class="bar"><b></b></div>
    <div class="tm"><span>1:07</span><span>−1:51</span></div>
    <div class="ct">${ic('prev')}<span class="pp">${ic('pause')}</span>${ic('next')}</div>
  </div>
  <div class="qa" style="left:46px"><svg class="i" viewBox="0 0 24 24"><path d="M8 2h8v4l-2 4v11a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1V10L8 6zm3 10v3h2v-3z"/></svg></div>
  <div class="qa" style="right:46px"><svg class="i" viewBox="0 0 24 24"><path d="M9 4h6l1.5 2H20a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h3.5zm3 4a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/></svg></div>
  <div class="home-ind"></div>
`;
</script>
</body></html>
