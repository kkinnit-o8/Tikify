<!doctype html>
<html><head><meta charset="utf-8">
<title>Tikify — TikTok ad 9:16</title>
<!-- Inter: the closest Google Font to the reference's SF-style type and to Tikify's own system-font UI (SF Pro on iPhone) -->
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..900&display=block" rel="stylesheet">
<style>
  html,body{margin:0;background:#000;overflow:hidden}
  #film{position:relative;overflow:hidden;background:#050507;font-family:Inter}
  #world{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0}
</style></head>
<body>
<div id="film"><div id="world"></div></div>
<script src="engine.js"></script>
<script src="app_states.js"></script>
<script src="lib.js"></script>
<script>L.bgScene();</script>
<!-- one <script> per scene: a syntax error in one must not break the others -->
<script src="scenes/s1_intro.js"></script>
<script src="scenes/s2_phone.js"></script>
<script src="scenes/s3_stats.js"></script>
<script src="scenes/s4_list.js"></script>
<script src="scenes/s5_end.js"></script>
<script>
  FILM.fonts = ['400 100px Inter', '500 100px Inter', '600 100px Inter', '700 100px Inter', '800 100px Inter'];
  L.GLOW.sort((a, b) => a[0] - b[0]);
  // zoom punches on the music: the bass drop and the downbeats after it (the whole frame kicks in and settles)
  FILM.CAM = [{ t0: 0, t1: .001, a: {}, b: {} }].concat([[L.DROP, .05, .45], [L.B(19), .022, .35], [L.B(23), .03, .4], [L.B(27), .03, .45]]
    .map(([t, k, d]) => ({ t0: t, t1: t + d, a: { s: 1 + k }, b: {}, ease: FILM.E.out(3) })));
  FILM.start({ dur: 18.84, fps: 30, W: 1080, H: 1920 });   // = the track, BLAIR (BP edit audio)
</script>
</body></html>
